.kaniko-build:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  dependencies: []
  before_script:
    - |
      : "${CI_REGISTRY:?Habilite o Container Registry do projeto}"
      : "${CI_REGISTRY_IMAGE:?Container Registry do projeto indisponivel}"
      : "${CI_REGISTRY_USER:?Usuario nativo do registry indisponivel}"
      : "${CI_REGISTRY_PASSWORD:?Credencial nativa do registry indisponivel}"
      (
        umask 077
        mkdir -p /kaniko/.docker
        AUTH="$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${CI_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
      )

build-api:
  extends: .kaniko-build
  stage: build-api
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile" \
        --destination "${API_IMAGE}" \
        --snapshot-mode=redo \
        --use-new-run \
        --cache=false \
        --compressed-caching=false \
        --verbosity=warn

build-web:
  extends: .kaniko-build
  stage: build-web
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/web.Dockerfile" \
        --build-arg API_INTERNAL_URL="${API_INTERNAL_URL}" \
        --build-arg APP_ORIGIN="${APP_ORIGIN}" \
        --destination "${WEB_IMAGE}" \
        --snapshot-mode=redo \
        --use-new-run \
        --cache=false \
        --compressed-caching=false \
        --verbosity=warn

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies: []
  resource_group: pharosgrc
  environment:
    name: homologacao
    url: "${APP_ORIGIN}"
  script:
    - kubectl apply -f k8s/01-configmap.yaml -n pharosgrc
    - kubectl apply -f k8s/03-attachments-pvc.yaml -n pharosgrc
    - kubectl apply -f k8s/04-redis-services.yaml -n pharosgrc
    - kubectl apply -f k8s/05-redis-statefulset.yaml -n pharosgrc
    - kubectl rollout status statefulset/pharosgrc-redis -n pharosgrc --timeout=300s
    - kubectl apply -f k8s/06-api-service.yaml -n pharosgrc
    - kubectl apply -f k8s/08-web-service.yaml -n pharosgrc
    - |
      kubectl set image --local -f k8s/07-api-deployment.yaml \
        api="${API_IMAGE}" -o yaml |
        kubectl apply -f - -n pharosgrc
    - |
      kubectl set image --local -f k8s/09-web-deployment.yaml \
        web="${WEB_IMAGE}" -o yaml |
        kubectl apply -f - -n pharosgrc
    - kubectl rollout status deployment/pharosgrc-api -n pharosgrc --timeout=300s
    - kubectl rollout status deployment/pharosgrc-web -n pharosgrc --timeout=300s
