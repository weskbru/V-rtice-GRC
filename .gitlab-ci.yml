# Builds em estagios SEQUENCIAIS, nao paralelos: cada build do Kaniko instala
# o workspace pnpm inteiro (~4-6 GB de disco temporario). Tres em paralelo
# esgotaram o ephemeral-storage do node do runner (pod despejado pelo kubelet).
stages:
  - build-api
  - build-web
  - build-migrate
  - deploy

variables:
  API_IMAGE: "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHORT_SHA}"
  WEB_IMAGE: "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHORT_SHA}"
  MIGRATE_IMAGE: "${CI_REGISTRY_IMAGE}/migrate:${CI_COMMIT_SHORT_SHA}"
  KUBE_NAMESPACE: "pharosgrc"
  REGISTRY_SECRET_NAME: "gitlab-registry-secret"
  DEPLOYMENT_API: "pharosgrc-api"
  DEPLOYMENT_WEB: "pharosgrc-web"
  MIGRATE_JOB: "pharosgrc-migrate"
  # Deve bater com APP_ORIGIN em k8s/01-configmap.yaml e com o host do
  # k8s/06-ingress.yaml. O web fixa este valor no build (next.config.ts).
  APP_ORIGIN: "https://pharosgrc.aeb.gov.br"
  # Destino do rewrite /api/* do Next, fixado no build. Em producao o Ingress
  # ja manda /api direto para a API; isto so cobre acesso direto ao pod web.
  WEB_API_INTERNAL_URL: "http://pharosgrc-api:3001"

# Variaveis obrigatorias em Settings > CI/CD > Variables (Masked + Protected):
#   PHAROS_DATABASE_URL            postgresql://pharos_app:<senha>@<host>:5432/pharos_grc?schema=public
#   PHAROS_DATABASE_MIGRATION_URL  postgresql://pharos_owner:<senha>@<host>:5432/pharos_grc?schema=public
# Nenhum segredo fica em arquivo versionado: o deploy cria os Secrets a
# partir delas.

.kaniko:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - rke2-prod
  only:
    - main
  variables:
    KUBERNETES_CPU_REQUEST: "500m"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    # Reserva disco temporario: o scheduler so coloca o pod num node que
    # tenha esse espaco livre, em vez de despeja-lo no meio do build.
    # Exige ephemeral_storage_overwrite_max_allowed no config.toml do runner;
    # se o job falhar reclamando de overwrite, remova estas duas linhas.
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "8Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "12Gi"
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH="$(printf '%s:%s' \
        "${CI_REGISTRY_USER}" \
        "${CI_REGISTRY_PASSWORD}" |
        base64 | tr -d '\n')"
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${CI_REGISTRY}": {
            "auth": "${AUTH}"
          }
        }
      }
      EOF

#########################################################
# Stage 1a - Build da API (NestJS)
#########################################################
build_api:
  extends: .kaniko
  stage: build-api
  script:
    - echo "BUILD API"
    # Contexto = raiz do repo: o workspace pnpm precisa do lockfile e de
    # todos os pacotes (ver cabecalho do docker/api.Dockerfile).
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/api.Dockerfile" \
        --target runtime \
        --destination "${API_IMAGE}" \
        --destination "${CI_REGISTRY_IMAGE}/api:latest" \
        --snapshot-mode=redo \
        --single-snapshot \
        --use-new-run \
        --cache=false \
        --compressed-caching=false \
        --verbosity=info

#########################################################
# Stage 1b - Build da imagem de migracao (Prisma CLI)
#########################################################
build_migrate:
  extends: .kaniko
  stage: build-migrate
  script:
    - echo "BUILD MIGRATE"
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/api.Dockerfile" \
        --target migrate \
        --destination "${MIGRATE_IMAGE}" \
        --destination "${CI_REGISTRY_IMAGE}/migrate:latest" \
        --snapshot-mode=redo \
        --single-snapshot \
        --use-new-run \
        --cache=false \
        --compressed-caching=false \
        --verbosity=info

#########################################################
# Stage 1c - Build do web (Next.js standalone)
#########################################################
build_web:
  extends: .kaniko
  stage: build-web
  script:
    - echo "BUILD WEB"
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/web.Dockerfile" \
        --build-arg API_INTERNAL_URL="${WEB_API_INTERNAL_URL}" \
        --build-arg APP_ORIGIN="${APP_ORIGIN}" \
        --destination "${WEB_IMAGE}" \
        --destination "${CI_REGISTRY_IMAGE}/web:latest" \
        --snapshot-mode=redo \
        --single-snapshot \
        --use-new-run \
        --cache=false \
        --compressed-caching=false \
        --verbosity=info

#########################################################
# Stage 2 - Deploy no RKE2
#########################################################
deploy_to_rke2:
  stage: deploy
  only:
    - main
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags:
    - rke2-prod
  dependencies: []
  script:
    - echo "VALIDANDO VARIAVEIS"
    - |
      for v in PHAROS_DATABASE_URL PHAROS_DATABASE_MIGRATION_URL; do
        eval "val=\${$v}"
        if [ -z "${val}" ]; then
          echo "Variavel ${v} nao definida em Settings > CI/CD > Variables"
          exit 1
        fi
      done

    - echo "VALIDANDO ACESSO AO CLUSTER"
    - kubectl cluster-info

    - echo "GARANTINDO NAMESPACE"
    - |
      kubectl create namespace "${KUBE_NAMESPACE}" \
        --dry-run=client -o yaml | kubectl apply -f -

    # Descomente este bloco se os pods ficarem em ImagePullBackOff, ou seja,
    # se os nodes do cluster nao tiverem credencial do registry configurada.
    # Exige as variaveis REGISTRY_PULL_USER e REGISTRY_PULL_PASSWORD
    # (mascaradas) em Settings > CI/CD > Variables, e o imagePullSecrets
    # correspondente nos deployments e no job de migracao.
    #- echo "GARANTINDO IMAGE PULL SECRET"
    #- |
    #  kubectl create secret docker-registry "${REGISTRY_SECRET_NAME}" \
    #    --namespace "${KUBE_NAMESPACE}" \
    #    --docker-server="${CI_REGISTRY}" \
    #    --docker-username="${REGISTRY_PULL_USER}" \
    #    --docker-password="${REGISTRY_PULL_PASSWORD}" \
    #    --dry-run=client -o yaml | kubectl apply -f -

    - echo "GARANTINDO SECRETS"
    # API em execucao: so o papel restrito (ADR-005). O env.schema.ts exige
    # DATABASE_MIGRATION_URL preenchida e distinta, mas a API nunca conecta
    # com ela (so o `prisma migrate` usa) — por isso recebe um endereco
    # inerte, e a credencial de owner nunca chega ao pod que serve trafego.
    - |
      kubectl create secret generic pharosgrc-secret \
        --namespace "${KUBE_NAMESPACE}" \
        --from-literal=DATABASE_URL="${PHAROS_DATABASE_URL}" \
        --from-literal=DATABASE_MIGRATION_URL="postgresql://unused:unused@owner-not-available-at-runtime.invalid:5432/unused" \
        --dry-run=client -o yaml | kubectl apply -f -
    # Job de migracao: unico lugar onde o papel owner aparece.
    - |
      kubectl create secret generic pharosgrc-migrate-secret \
        --namespace "${KUBE_NAMESPACE}" \
        --from-literal=DATABASE_URL="${PHAROS_DATABASE_URL}" \
        --from-literal=DATABASE_MIGRATION_URL="${PHAROS_DATABASE_MIGRATION_URL}" \
        --dry-run=client -o yaml | kubectl apply -f -

    - echo "ATUALIZANDO IMAGENS"
    - |
      sed -i "s|image: .*/pharosgrc/api:.*|image: ${API_IMAGE}|g" \
        k8s/02-api-deployment.yaml
      sed -i "s|image: .*/pharosgrc/web:.*|image: ${WEB_IMAGE}|g" \
        k8s/03-web-deployment.yaml
      sed -i "s|image: .*/pharosgrc/migrate:.*|image: ${MIGRATE_IMAGE}|g" \
        k8s/08-migrate-job.yaml

    - echo "APLICANDO INFRAESTRUTURA"
    - kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/01-configmap.yaml
    - kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/07-pvc.yaml
    - kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/05-redis.yaml
    - kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/04-services.yaml

    # Migracao ANTES do rollout: se falhar, a esteira para e a versao
    # anterior continua no ar com o schema anterior.
    - echo "APLICANDO MIGRACOES"
    - |
      kubectl delete job "${MIGRATE_JOB}" -n "${KUBE_NAMESPACE}" \
        --ignore-not-found --wait=true
      kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/08-migrate-job.yaml
      if ! kubectl wait --for=condition=complete job/"${MIGRATE_JOB}" \
        -n "${KUBE_NAMESPACE}" --timeout=600s; then
        echo "MIGRACAO FALHOU"
        kubectl logs job/"${MIGRATE_JOB}" -n "${KUBE_NAMESPACE}" || true
        exit 1
      fi
      kubectl logs job/"${MIGRATE_JOB}" -n "${KUBE_NAMESPACE}" || true

    - echo "APLICANDO APLICACAO"
    - kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/02-api-deployment.yaml
    - kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/03-web-deployment.yaml
    - kubectl apply -n "${KUBE_NAMESPACE}" -f k8s/06-ingress.yaml

    # ConfigMap/Secret alterados nao reiniciam pods sozinhos.
    - |
      kubectl rollout restart deployment/"${DEPLOYMENT_API}" \
        -n "${KUBE_NAMESPACE}"

    - echo "ACOMPANHANDO ROLLOUT"
    - |
      kubectl rollout status deployment/"${DEPLOYMENT_API}" \
        -n "${KUBE_NAMESPACE}" --timeout=300s
      kubectl rollout status deployment/"${DEPLOYMENT_WEB}" \
        -n "${KUBE_NAMESPACE}" --timeout=300s

    - echo "STATUS FINAL"
    - kubectl get deployments -n "${KUBE_NAMESPACE}"
    - kubectl get pods -n "${KUBE_NAMESPACE}" -o wide
    - kubectl get services -n "${KUBE_NAMESPACE}"
    - kubectl get ingress -n "${KUBE_NAMESPACE}"

  environment:
    name: production
