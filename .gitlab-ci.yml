# Mesmo fluxo operacional do sis-bem-estar: rke2-prod, Sonar, Kaniko e kubectl.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - test
  - sonar
  - build-api
  - build-web
  - deploy

default:
  tags:
    - rke2-prod

variables:
  API_IMAGE: "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}"
  WEB_IMAGE: "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}"
  API_INTERNAL_URL: "http://pharosgrc-api:3001"
  APP_ORIGIN: "https://pharos-dsv.aeb.gov.br"
  KUBERNETES_CPU_REQUEST: "500m"
  KUBERNETES_MEMORY_REQUEST: "1Gi"
  KUBERNETES_CPU_LIMIT: "2"
  KUBERNETES_MEMORY_LIMIT: "4Gi"

test:
  stage: test
  image: node:22-alpine
  variables:
    NODE_ENV: "test"
  cache:
    key:
      prefix: pharosgrc-pnpm
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.34.5 --activate
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store"
  script:
    - pnpm install --frozen-lockfile --reporter=append-only
    - pnpm --filter @pharos/api-types run build
    - pnpm --filter @pharos/design-system run build
    - pnpm run typecheck
    - mkdir -p reports
    - >
      pnpm --filter @pharos/api run test:unit
      --silent=passed-only --reporter=dot --reporter=junit
      --outputFile.junit="${CI_PROJECT_DIR}/reports/backend-unit.xml"
      --maxWorkers=2 --passWithNoTests=false
    - >
      pnpm --filter @pharos/web run test:unit
      --silent=passed-only --reporter=dot --reporter=junit
      --outputFile.junit="${CI_PROJECT_DIR}/reports/frontend-unit.xml"
      --maxWorkers=2 --passWithNoTests=false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
    reports:
      junit:
        - reports/backend-unit.xml
        - reports/frontend-unit.xml

