services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-pharos_grc}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-pharos_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-pharos_owner_dev}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-pharos_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-pharos_app_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-pharos_app}:${POSTGRES_APP_PASSWORD:-pharos_app_dev}@postgres:5432/${POSTGRES_DB:-pharos_grc}?schema=public
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_OWNER_USER:-pharos_owner}:${POSTGRES_OWNER_PASSWORD:-pharos_owner_dev}@postgres:5432/${POSTGRES_DB:-pharos_grc}?schema=public
      REDIS_URL: redis://redis:6379
      ATTACHMENT_STORAGE_PATH: /app/storage/attachments
      API_PORT: "3001"
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - attachments_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
        APP_ORIGIN: http://localhost:${WEB_PORT:-3000}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  attachments_storage:
