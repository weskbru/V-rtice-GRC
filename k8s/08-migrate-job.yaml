# Aplica as migracoes do Prisma (`prisma migrate deploy`) antes do rollout.
# Roda com a imagem `migrate` (docker/api.Dockerfile, --target migrate), que
# tem o CLI do Prisma que a imagem da API nao carrega. A credencial de owner
# (DATABASE_MIGRATION_URL, ADR-005) fica SO no Secret `pharosgrc-migrate-secret`,
# nunca no Secret que a API em execucao le.
#
# Job e imutavel: a esteira apaga o anterior antes de aplicar este.
apiVersion: batch/v1
kind: Job
metadata:
  name: pharosgrc-migrate
  namespace: pharosgrc
  labels:
    app: pharosgrc-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pharosgrc-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # A tag e substituida pelo job de deploy da esteira.
          image: registry.aeb.gov.br/cti/pharosgrc/migrate:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: pharosgrc-migrate-secret
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
