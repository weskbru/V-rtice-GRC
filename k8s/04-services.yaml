apiVersion: v1
kind: Service
metadata:
  name: pharosgrc-api
  namespace: pharosgrc
  labels:
    app: pharosgrc-api
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: pharosgrc-api
---
apiVersion: v1
kind: Service
metadata:
  name: pharosgrc-web
  namespace: pharosgrc
  labels:
    app: pharosgrc-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: pharosgrc-web
