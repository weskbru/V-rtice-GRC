# Redis e obrigatorio com NODE_ENV=production (D-2), mas nunca e fonte de
# verdade (ADR-002/003/004): so cache e contadores de rate limit. Por isso
# roda sem volume persistente — perder o conteudo num restart e aceitavel.
# Se o cluster ja oferece um Redis gerenciado, remova este arquivo do deploy
# e aponte REDIS_URL (01-configmap.yaml) para ele.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharosgrc-redis
  namespace: pharosgrc
  labels:
    app: pharosgrc-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharosgrc-redis
  template:
    metadata:
      labels:
        app: pharosgrc-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "250m"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pharosgrc-redis
  namespace: pharosgrc
  labels:
    app: pharosgrc-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: pharosgrc-redis
