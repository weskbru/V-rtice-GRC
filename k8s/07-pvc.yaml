# Armazenamento de anexos (ADR-010, adaptador local). Sem storageClassName:
# usa a classe padrao do cluster. Ajuste o tamanho conforme o volume esperado.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pharosgrc-attachments
  namespace: pharosgrc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
