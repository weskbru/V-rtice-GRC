apiVersion: apps/v1
kind: Deployment
metadata:
  name: verticegrc-api
  namespace: verticegrc
  labels:
    app.kubernetes.io/name: verticegrc
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: verticegrc
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verticegrc
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: api
          # Registry e tag são placeholders; confirme o endereço antes do deploy.
          image: registry.example.invalid/verticegrc/api:CHANGE_ME
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: verticegrc-config
            - secretRef:
                name: verticegrc-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: attachments
              mountPath: /app/storage
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: verticegrc-attachments
