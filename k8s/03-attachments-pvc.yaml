apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verticegrc-attachments
  namespace: verticegrc
  labels:
    app.kubernetes.io/name: verticegrc
    app.kubernetes.io/component: api
spec:
  # Usa a StorageClass padrão do cluster; configure conforme sua implantação.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
