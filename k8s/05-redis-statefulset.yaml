apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pharosgrc-redis
  namespace: pharosgrc
  labels:
    app.kubernetes.io/name: pharosgrc
    app.kubernetes.io/component: redis
spec:
  serviceName: pharosgrc-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pharosgrc
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharosgrc
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: svlparancherwk1
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
