apiVersion: v1
kind: Service
metadata:
  name: verticegrc-redis-headless
  namespace: verticegrc
  labels:
    app.kubernetes.io/name: verticegrc
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: verticegrc
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
