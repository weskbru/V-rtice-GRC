apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharosgrc-web
  namespace: pharosgrc
  labels:
    app.kubernetes.io/name: pharosgrc
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pharosgrc
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharosgrc
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: web
          # Construa a imagem com os ARGs documentados no README.
          image: registry.gitlab.aeb.gov.br/cti/pharosgrc/web:CHANGE_ME
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pharosgrc-config
                  key: NODE_ENV
            - name: API_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: pharosgrc-config
                  key: API_INTERNAL_URL
            - name: APP_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: pharosgrc-config
                  key: APP_ORIGIN
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
