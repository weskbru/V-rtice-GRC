apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharosgrc-api
  namespace: pharosgrc
  labels:
    app: pharosgrc-api
spec:
  # Uma replica: o armazenamento de anexos e disco local (ADR-010) num PVC
  # ReadWriteOnce. Escalar exige volume RWX ou o adaptador S3 futuro.
  replicas: 1
  strategy:
    # Recreate, nao RollingUpdate: o PVC RWO nao pode ser montado por dois
    # pods em nodes diferentes durante a troca.
    type: Recreate
  selector:
    matchLabels:
      app: pharosgrc-api
  template:
    metadata:
      labels:
        app: pharosgrc-api
    spec:
      securityContext:
        # Usuario `pharos` (UID/GID 10001) criado no docker/api.Dockerfile;
        # fsGroup garante escrita no volume de anexos.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          # A tag e substituida pelo job de deploy da esteira.
          image: registry.aeb.gov.br/cti/pharosgrc/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: pharosgrc-config
            - secretRef:
                name: pharosgrc-secret
          volumeMounts:
            - name: attachments
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: pharosgrc-attachments
