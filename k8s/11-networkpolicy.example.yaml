# Exemplos excluídos do kustomization. Confirme CNI, DNS e labels antes de usar.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharosgrc-default-deny
  namespace: pharosgrc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pharosgrc
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharosgrc-web-traffic
  namespace: pharosgrc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pharosgrc
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Namespace e labels fictícios; substitua pelos do Ingress Controller.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-controller-example
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-controller-example
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pharosgrc
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 3001
    - to:
        # Confirme labels do DNS e eventual uso de NodeLocal DNSCache.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharosgrc-api-traffic
  namespace: pharosgrc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pharosgrc
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pharosgrc
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pharosgrc
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 192.168.52.215/32
      ports:
        - protocol: TCP
          port: 5432
    - to:
        # Confirme labels do DNS e eventual uso de NodeLocal DNSCache.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pharosgrc-redis-traffic
  namespace: pharosgrc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pharosgrc
      app.kubernetes.io/component: redis
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pharosgrc
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 6379
  egress: []
