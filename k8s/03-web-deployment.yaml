apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharosgrc-web
  namespace: pharosgrc
  labels:
    app: pharosgrc-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pharosgrc-web
  template:
    metadata:
      labels:
        app: pharosgrc-web
    spec:
      containers:
        - name: web
          # A tag e substituida pelo job de deploy da esteira.
          image: registry.aeb.gov.br/cti/pharosgrc/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            # Lido em tempo de requisicao por server-session.ts (checagem de
            # sessao no servidor). O destino do rewrite /api/* foi fixado no
            # build (--build-arg); em producao o Ingress manda /api direto
            # para a API e o rewrite nem e usado.
            - name: API_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: pharosgrc-config
                  key: API_INTERNAL_URL
            - name: APP_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: pharosgrc-config
                  key: APP_ORIGIN
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
