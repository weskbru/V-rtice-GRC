      AUTH_RATE_LIMIT_ORIGIN_ATTEMPTS: "1000"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "300"
      AUTH_LOCKOUT_MINUTES: "15"
      ATTACHMENT_STORAGE_DRIVER: local
      ATTACHMENT_STORAGE_PATH: ./storage/attachments
      ATTACHMENT_MAX_SIZE_BYTES: "26214400"
      ATTACHMENT_ALLOWED_MIME_TYPES: application/pdf,image/png,image/jpeg,text/plain
      SEED_DEV_FIXTURES: "true"
      SEED_ADMIN_EMAIL: admin@example.local
      SEED_ADMIN_PASSWORD: "E2E-CI-Only-P4ssw0rd!"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Provision the two ADR-005 database roles
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql -v ON_ERROR_STOP=1 -d "$POSTGRES_DB" -f docker/postgres/init/01-roles.sql

      - run: pnpm --filter @pharos/api exec prisma generate
      - run: pnpm run build
      - run: pnpm --filter @pharos/web exec playwright install --with-deps webkit
      - run: pnpm --filter @pharos/api exec prisma migrate deploy
      - run: pnpm --filter @pharos/api exec prisma db seed

      - name: Start the API and web app, wait for both to report ready
        run: |
          set -e
          nohup node apps/api/dist/src/main.js > api.log 2>&1 &
          nohup pnpm --filter @pharos/web exec next start -p "$WEB_PORT" > web.log 2>&1 &

          echo "Waiting for the API ($API_INTERNAL_URL/api/v1/health/ready)..."
          ready=false
          for i in $(seq 1 60); do
            if curl -sf "$API_INTERNAL_URL/api/v1/health/ready" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "API did not become ready in time." >&2
            cat api.log
            exit 1
          fi
          echo "API is ready."

          echo "Waiting for the web app ($APP_ORIGIN/login)..."
          ready=false
          for i in $(seq 1 60); do
            if curl -sf "$APP_ORIGIN/login" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Web app did not become ready in time." >&2
            cat web.log
            exit 1
          fi
          echo "Web app is ready."

      - name: Run Playwright (webkit)
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: "true"
        # TEMPORARY, diagnostic-only (staged for review, not to be dispatched
        # without explicit sign-off): run `34617754814` found WebKit crashing
        # mid-run (10 "Target page, context or browser has been closed"
        # instances) badly enough that Playwright abandoned the rest of its
        # plan (91 of 115 tests never ran) — confirmed to be a real bail-out,
        # not `maxFailures` (grepped this file and playwright.config.ts;
        # neither sets it, so the config default of unlimited applies and
        # cannot explain the shortfall). `--workers=1` overrides
        # playwright.config.ts's shared `workers: 4` for THIS invocation only
        # (chromium/firefox untouched) to test whether the instability is
        # concurrency-driven (one worker changes the outcome) or the engine
        # is simply unstable under this application over a long run
        # regardless (one worker does not). Revert this line once that
        # question is answered, in either direction — it is not a proposed
        # permanent setting.
        #
        # ---- Reviewed 2026-09-14 (F-72). KEPT, and here is the reasoning ----
        #
        # The question this flag was staged to answer is still open, and the
        # evidence that arrived since points AT concurrency rather than away
        # from it:
        #
        # - F-59 gives a mechanism that predicts exactly this shape. The global
        #   `ThrottlerGuard` (`THROTTLE_LIMIT=100` per 60s, counted per client
        #   IP) is shared by every Playwright worker on one runner. Phase 7
        #   measured the four-worker Chromium suite getting 429 on `/auth/login`
        #   itself. A 429 on `GET /auth/session` mid-journey produces navigation
        #   timeouts and dead pages, which is what "target page has been closed"
        #   looks like from the other end.
        # - "The roles specs now pass on all three engines" is TRUE and does not
        #   answer this: that measurement was 15/15 + 14/14 on WebKit at ONE
        #   worker, on two files, on a developer machine. It says nothing about
        #   115 tests at four workers on a shared-IP runner.
        #
        # So removing `--workers=1` today would delete the only concurrency
        # limit CI has, on the engine that already bailed out once, to answer a
        # question nobody has dispatched. The risk of removing it is a red
        # WebKit job whose failures are indistinguishable from product defects
        # — the exact confusion F-72 exists to end.
        #
        # What DID change is that a dispatch will now answer it properly.
        # `execution-ledger-reporter` (playwright.config.ts) prints
        # DISCOVERED / EXECUTED / PASSED / FAILED / SKIPPED / NOT RUN for every
        # job and NAMES each test that never ran, and it fails the run when any
        # discovered test did not execute. The "91 of 115 never ran" that this
        # flag was a reaction to would today be an explicit, itemised NOT RUN
        # list rather than a shortfall somebody had to notice by subtraction.
        # The recommended next step is one `workflow_dispatch` with this line
        # as-is and one with it removed, comparing the two ledgers — not a
        # silent revert in either direction.
        #
        # ---- Reviewed 2026-09-19 (rodada 023, reconciliação de documentação
        # paralela). KEPT — this is a dated, justified decision, not an
        # oversight ----
        #
        # F-59 (docs/deferred-findings.md) closed this same round: the global
        # ThrottlerGuard under local E2E concurrency now has a documented,
        # verified mitigation (--workers=1 for a full local battery against a
        # long-lived dev database). That closure does not answer the question
        # this flag exists to answer — F-59 is about a LOCAL workstation's
        # accumulated dev database, this flag is about the WebKit job on a
        # SHARED-IP CI runner, and F-59's own mechanism (ThrottlerGuard,
        # counted per client IP) is exactly why the two are not
        # interchangeable evidence for each other.
        #
        # What DOES block answering it: F-58 (docs/deferred-findings.md)
        # records that remote CI is blocked by GitHub billing on this
        # account, so the workflow_dispatch comparison recommended above
        # cannot be run today, by anyone, regardless of local findings
        # closing. This line stays exactly as-is — not "temporary and
        # forgotten," but "kept until F-58 clears, then revisited with the
        # comparison dispatch this comment already specifies." Whoever
        # restores remote CI access is the owner of that next dispatch.
        run: pnpm --filter @pharos/web exec playwright test --project=webkit --workers=1

      - name: Dump API/web server logs on failure
        if: failure()
        run: |
          echo "----- apps/api log -----"
          cat api.log || true
          echo "----- apps/web log -----"
          cat web.log || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-webkit
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ci-required (T053/T054, D-18, F-64, 007-implementation-remediation):
  # `test-integration`, `test-contract`, `test-e2e`, `test-e2e-firefox` and
  # `test-e2e-webkit` all declare the SAME five `needs`
  # (`lint`, `format-check`, `typecheck`, `test-unit`, `audit`). If any one
  # of those five goes red, GitHub reports the downstream jobs `skipped` —
  # never `failed` — and a branch-protection rule that requires only those
  # four by name would show a clean, mergeable PR. F-33 and F-52 already hid
  # exactly this way once each; F-50 is the concrete precedent (the `audit`
  # gate went red over advisories and silently took every test job down
  # with it). This job is the single required check that closes the
  # structural hole: it runs unconditionally (`if: always()`), depends on
  # EVERY other job in this workflow, and fails the instant any of them is
  # anything other than `success` — `skipped` included. Branch protection
  # should name only this job, never the individual gates it aggregates.
  #
  # `test-e2e-firefox`/`test-e2e-webkit` are deliberately exempt from the
  # blanket "skipped is failure" rule: their own `if: github.event_name ==
  # 'workflow_dispatch'` means they are EXPECTED to report `skipped` on
  # every ordinary push/PR (F-4/F-19's own documented scoping, not a gap) —
  # this job would otherwise fail every normal push for jobs that were
  # never supposed to run on it. They are still required to be `success` on
  # the one trigger where they do run.
  # ---------------------------------------------------------------------------
  ci-required:
    name: CI required checks
    if: always()
    needs:
      - install
      - lint
      - format-check
      - typecheck
      - test-unit
      - audit
      - build
      - openapi-check
      - api-types-check
      - test-integration
      - test-contract
      - test-e2e
      - test-e2e-firefox
      - test-e2e-webkit
    runs-on: ubuntu-latest
    steps:
      - name: Every job except test-e2e-firefox/test-e2e-webkit must be success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.key != "test-e2e-firefox" and .key != "test-e2e-webkit"))
            | map(select(.value.result != "success"))
            | map("\(.key): \(.value.result)")
            | .[]
          ')
          if [ -n "$failed" ]; then
            echo "::error::The following required jobs did not succeed (skipped counts as a failure here):"
            echo "$failed"
            exit 1
          fi
          echo "All required jobs succeeded."

      - name: test-e2e-firefox/test-e2e-webkit must be success WHEN expected to run
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREFOX_RESULT: ${{ needs.test-e2e-firefox.result }}
          WEBKIT_RESULT: ${{ needs.test-e2e-webkit.result }}
        run: |
          failed=false
          if [ "$FIREFOX_RESULT" != "success" ]; then
            echo "::error::test-e2e-firefox was dispatched on this run and reported '$FIREFOX_RESULT', not success."
            failed=true
          fi
          if [ "$WEBKIT_RESULT" != "success" ]; then
            echo "::error::test-e2e-webkit was dispatched on this run and reported '$WEBKIT_RESULT', not success."
            failed=true
          fi
          if [ "$failed" = "true" ]; then
            exit 1
          fi
          echo "test-e2e-firefox and test-e2e-webkit both succeeded on this dispatched run."
