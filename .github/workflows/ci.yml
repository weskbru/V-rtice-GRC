      POSTGRES_OWNER_USER: pharos_owner
      POSTGRES_OWNER_PASSWORD: pharos_owner_ci
      POSTGRES_APP_USER: pharos_app
      POSTGRES_APP_PASSWORD: pharos_app_ci
