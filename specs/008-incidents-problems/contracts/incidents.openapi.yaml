openapi: 3.1.0
info:
  title: Vértice GRC - Incident Management API
  version: 1.0.0
  summary: >-
    Incident register and lifecycle, linked to Risk, Asset and Process, consuming the shared
    Action and Evidence capabilities for corrective work and proof.
  description: |
    Draft contract for `008-incidents-problems` (spec.md, data-model.md). Written before
    implementation - unlike this project's later-phase contracts, nothing below has yet been
    verified against running code, and every citation is to the specification, not to a file and
    line of shipped source.

    **Every operation is subject to two independent server-side checks**, the same pattern every
    business module in this platform already follows: the caller's `incident:*` permission, and the
    caller's resolved organizational scope, applied as a mandatory predicate on every read and every
    write.

    **Existence is not disclosed** among callers who hold `incident:view`: a record outside the
    caller's scope and one that does not exist at all both answer `404`, never `403`, on every
    operation that acts on a single record. A caller holding no `incident:view` at all is refused
    `403` before any record is loaded (the established platform shape - `control:view`,
    `asset:view` behave identically).

    **`code` is never client-supplied.** Assigned by the server on creation with the `INC-` prefix
    (data-model.md §3). Rejected as an unknown property if supplied.

    **There is no delete operation.** An incident that was opened by mistake is cancelled
    (`CANCELLED`), never removed - the link tables referencing it carry `Restrict` foreign keys, and
    every transition is independently preserved on the audit trail.

    **Status changes only through `POST /incidents/{incidentId}/transitions`.** `PATCH` never
    accepts `status`; the transition endpoint is the sole writer, and its own legality table
    (data-model.md, research.md D-4) is the single source of truth for which moves are legal.

    **The relationship to `Problem` is read-only here, by decision of the coordinator** (spec.md
    "Decisões do coordenador"; research.md D-13 to D-15): many-to-many, optional on both sides -
    `Incident` needs no `Problem` to exist, and a single incident can carry more than one
    contributing problem. `problems.openapi.yaml` owns the write path
    (`POST`/`DELETE /problems/{problemId}/incidents`), because the link is initiated from there;
    `GET /incidents/{incidentId}/problems` below reads the same `problem_incident_links` table
    directly, without this module importing `modules/problems` (ADR-011). The link never gates
    either lifecycle: no transition here inspects a linked problem's status, and none ever will
    without a new, explicit decision.
servers:
  - url: /api/v1
    description: Single-origin API root (ADR-014).
tags:
  - name: Incident Catalog
    description: Listing, searching and filtering the incident register (US1).
  - name: Incident Record
    description: Creating and maintaining an incident's descriptive data (US1).
  - name: Incident Lifecycle
    description: The five-state machine and its legal transitions (US1, data-model.md D-4).
  - name: Incident Relationships
    description: >-
      Links to Risk, Asset and Process (US3), plus the read-only view of the Problem link this
      module does not write (see description above).
security:
  - sessionCookie: []
paths:
  /incidents:
    get:
      operationId: listIncidents
      tags: [Incident Catalog]
      summary: List incidents in the caller's organizational scope.
      description: Requires `incident:view`. Scope applied as a mandatory predicate, including here.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentStatus'
          style: form
          explode: true
        - name: severity
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentSeverity'
          style: form
          explode: true
        - name: search
          in: query
          description: Matches against `code` and `title`.
          schema:
            type: string
        - name: orgUnitId
          in: query
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [code, title, severity, status, reportedOn, updatedAt]
            default: reportedOn
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Paginated incident summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncidentSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createIncident
      tags: [Incident Record]
      summary: Register a new incident.
      description: Requires `incident:create`. `orgUnitId` must exist and lie within the caller's scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /incidents/{incidentId}:
    get:
      operationId: getIncident
      tags: [Incident Record]
      summary: Fetch one incident's detail.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateIncident
      tags: [Incident Record]
      summary: Edit an incident's descriptive fields.
      description: >-
        Requires `incident:edit`. Never accepts `status`, `code`, or any resolution/cancellation
        field - those exist only through the transitions operation below.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncidentRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /incidents/{incidentId}/transitions:
    post:
      operationId: transitionIncident
      tags: [Incident Lifecycle]
      summary: Move an incident to a new status.
      description: >-
        Requires `incident:transition`. Legal moves: `OPEN->IN_PROGRESS`, `OPEN->CANCELLED`,
        `IN_PROGRESS->RESOLVED`, `IN_PROGRESS->CANCELLED`, `RESOLVED->CLOSED`,
        `RESOLVED->IN_PROGRESS` (reopen, requires `reopenReason`). Any other move is `422`.
        `toStatus: RESOLVED` requires `resolutionSummary`; `toStatus: CANCELLED` requires
        `cancellationReason` (data-model.md I1/I2).
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionIncidentRequest'
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Illegal transition, or a required field for this transition is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /incidents/{incidentId}/risks:
    get:
      operationId: listIncidentRiskLinks
      tags: [Incident Relationships]
      summary: List the risks linked to an incident.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: includeWithdrawn
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentRiskLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: linkIncidentToRisk
      tags: [Incident Relationships]
      summary: Link an incident to a risk it materializes.
      description: >-
        Requires `incident:link` **and** `risk:view` (ADR-020 part 5). The target risk must lie
        within the caller's organizational scope (ADR-020 part 4) - a risk outside scope, and a risk
        that does not exist, answer identically.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riskId]
              properties:
                riskId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentRiskLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Incident, or the target risk (out of scope or nonexistent - indistinguishable), not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /incidents/{incidentId}/risks/{linkId}:
    delete:
      operationId: unlinkIncidentFromRisk
      tags: [Incident Relationships]
      summary: Withdraw a risk link, preserving it on the audit trail.
      description: Requires `incident:link`. Marks `unlinkedAt`; never deletes the row.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn - returns the link, now carrying `unlinkedAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentRiskLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /incidents/{incidentId}/assets:
    get:
      operationId: listIncidentAssetLinks
      tags: [Incident Relationships]
      summary: List the assets linked to an incident.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: includeWithdrawn
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentAssetLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: linkIncidentToAsset
      tags: [Incident Relationships]
      summary: Link an incident to an asset it affected.
      description: Requires `incident:link` **and** `asset:view` (ADR-020 part 5).
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAssetLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /incidents/{incidentId}/assets/{linkId}:
    delete:
      operationId: unlinkIncidentFromAsset
      tags: [Incident Relationships]
      summary: Withdraw an asset link, preserving it on the audit trail.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAssetLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /incidents/{incidentId}/processes:
    get:
      operationId: listIncidentProcessLinks
      tags: [Incident Relationships]
      summary: List the processes linked to an incident.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: includeWithdrawn
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentProcessLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: linkIncidentToProcess
      tags: [Incident Relationships]
      summary: Link an incident to a process it interrupted.
      description: Requires `incident:link` **and** `process:view` (ADR-020 part 5).
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [processId]
              properties:
                processId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentProcessLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /incidents/{incidentId}/processes/{linkId}:
    delete:
      operationId: unlinkIncidentFromProcess
      tags: [Incident Relationships]
      summary: Withdraw a process link, preserving it on the audit trail.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentProcessLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /incidents/{incidentId}/problems:
    get:
      operationId: listIncidentProblemLinks
      tags: [Incident Relationships]
      summary: List the problems linked to an incident (read-only).
      description: >-
        Reads `problem_incident_links` directly - this module never writes to it.
        `POST`/`DELETE /problems/{problemId}/incidents` in `problems.openapi.yaml` is the only
        write path (decision of the coordinator, spec.md/research.md D-13 to D-15).
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: includeWithdrawn
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentProblemLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vertice_session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SortDirection:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    IncidentSeverity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    IncidentStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    IncidentSummary:
      type: object
      required: [id, code, title, severity, status, orgUnit, owner, reportedOn]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        orgUnit:
          $ref: '#/components/schemas/OrgUnitRef'
        owner:
          $ref: '#/components/schemas/UserRef'
        reportedOn:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          required: [description, reportedBy]
          properties:
            description:
              type: string
            reportedBy:
              $ref: '#/components/schemas/UserRef'
            resolutionSummary:
              type: [string, 'null']
            resolvedAt:
              type: [string, 'null']
              format: date-time
            resolvedBy:
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
            closedAt:
              type: [string, 'null']
              format: date-time
            closedBy:
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
            cancellationReason:
              type: [string, 'null']
            createdAt:
              type: string
              format: date-time
    CreateIncidentRequest:
      type: object
      required: [title, description, severity, orgUnitId, reportedOn]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        orgUnitId:
          type: string
          format: uuid
        reportedOn:
          type: string
          format: date
        ownerUserId:
          type: string
          format: uuid
          description: Defaults to the caller when omitted.
    UpdateIncidentRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        ownerUserId:
          type: string
          format: uuid
    TransitionIncidentRequest:
      type: object
      required: [toStatus]
      properties:
        toStatus:
          $ref: '#/components/schemas/IncidentStatus'
        resolutionSummary:
          type: string
          description: Required when `toStatus` is `RESOLVED`.
        cancellationReason:
          type: string
          description: Required when `toStatus` is `CANCELLED`.
        reopenReason:
          type: string
          description: Required when `toStatus` is `IN_PROGRESS` from `RESOLVED`.
    IncidentRiskLinkResponse:
      type: object
      required: [id, risk, linkedBy, linkedAt]
      properties:
        id:
          type: string
          format: uuid
        risk:
          $ref: '#/components/schemas/RiskRef'
        linkedBy:
          $ref: '#/components/schemas/UserRef'
        linkedAt:
          type: string
          format: date-time
        unlinkedAt:
          type: [string, 'null']
          format: date-time
    IncidentAssetLinkResponse:
      type: object
      required: [id, asset, linkedBy, linkedAt]
      properties:
        id:
          type: string
          format: uuid
        asset:
          $ref: '#/components/schemas/AssetRef'
        linkedBy:
          $ref: '#/components/schemas/UserRef'
        linkedAt:
          type: string
          format: date-time
        unlinkedAt:
          type: [string, 'null']
          format: date-time
    IncidentProcessLinkResponse:
      type: object
      required: [id, process, linkedBy, linkedAt]
      properties:
        id:
          type: string
          format: uuid
        process:
          $ref: '#/components/schemas/ProcessRef'
        linkedBy:
          $ref: '#/components/schemas/UserRef'
        linkedAt:
          type: string
          format: date-time
        unlinkedAt:
          type: [string, 'null']
          format: date-time
    RiskRef:
      type: object
      required: [id, code, title]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
    AssetRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    ProcessRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    ProblemRef:
      type: object
      required: [id, code, title, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatusRef'
    ProblemStatusRef:
      type: string
      description: >-
        Mirrors `problems.openapi.yaml`'s `ProblemStatus` - duplicated here because contracts never
        merge schemas across documents (packages/api-types convention).
      enum: [OPEN, IN_ANALYSIS, RESOLVED, CLOSED, CANCELLED]
    IncidentProblemLinkResponse:
      type: object
      required: [id, problem, linkedBy, linkedAt]
      properties:
        id:
          type: string
          format: uuid
        problem:
          $ref: '#/components/schemas/ProblemRef'
        linkedBy:
          $ref: '#/components/schemas/UserRef'
        linkedAt:
          type: string
          format: date-time
        unlinkedAt:
          type: [string, 'null']
          format: date-time
    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
    OrgUnitRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    Problem:
      type: object
      description: RFC 9457 problem detail - the single error shape across the API (ADR-009).
      required: [type, title, status, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: The request is malformed, or carries unknown properties.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No session cookie, or the session is expired or revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The caller can see the incident but lacks the permission for this specific action, or the
        request failed the cross-site request forgery origin check.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        No such incident, or it lies outside the caller's authorized organizational scope, or the
        caller lacks `incident:view` entirely - deliberately indistinguishable (FR-014).
      content:
        application/problem+json:
