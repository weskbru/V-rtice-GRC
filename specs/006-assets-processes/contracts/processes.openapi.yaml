openapi: 3.1.0
info:
  title: PharosGRC - Process Management API
  version: 1.0.0
  summary: >-
    Process catalog as a first-class business domain, with its own authority and organizational
    scope, replacing the minimal, unscoped registry two other modules used to read directly.
  description: |
    The sixth business module (promotion of the minimal `Process` registry introduced in Fase 1,
    per `docs/architecture/grc-roadmap.md` and CLAUDE.md §17 item 12), built in the same fase as
    `assets.openapi.yaml` and identical to it in form (FR-020) - the only differences are the
    resource name and the `PRC` code prefix. Every operation in this document is subject to two
    independent server-side checks (FR-009, FR-010):

    1. the caller's `resource:action` permission, named in each operation's description - `process:*`,
       never `risk:view` as the two operations this document replaces required until now (US2,
       research.md D-7);
    2. the caller's resolved organizational scope, applied as a mandatory predicate in the
       repository layer on every read and every write, **including the listing** - which today
       applies none at all (FR-010, spec "Vazamento 1").

    **Existence is not disclosed - among callers who hold `process:view`.** A single process
    outside the caller's organizational scope, and one that does not exist at all, are both
    answered with `404` on `GET /processes/{processId}` and on every operation that acts on one -
    never `403` - so the response cannot be used to probe for records.

    **A caller holding no `process:view` at all is refused `403`, on every operation in this
    document, including the single-record ones.** That is the platform's established behaviour, not
    a weakening chosen here: `PermissionGuard` refuses a missing permission before any handler runs
    and before any record is loaded, so there is no record whose existence could be disclosed at
    that point. `specs/003-controls-management`'s own contract and
    `apps/api/test/contract/control-catalog.spec.ts` already encode exactly this shape for
    `control:view`, and this document follows it rather than diverging.

    An earlier draft of this paragraph claimed the missing-permission case also collapsed into
    `404`. It was wrong about the shipped architecture, and is corrected here rather than left to
    be discovered by whoever implemented against it - which is what happened: the implementation
    followed the established `403` precedent and reported the contradiction.

    `403` therefore covers two cases: a caller lacking `process:view` entirely, and a caller who
    can see the process but lacks the permission for the specific action attempted. The cross-site
    request forgery origin check also answers `403`.

    **The organizational unit is required on every process this API creates, and is verified on
    both sides.** `orgUnitId` is a required property of `CreateProcessRequest` (invariant A1,
    data-model.md §4) - the underlying `processes.org_unit_id` column stays nullable, unchanged, so
    that the handful of rows created before this module existed remain readable (research.md D-2);
    the obligation lives in the application, not the schema. A target unit that does not exist or
    lies outside the caller's scope is refused with `422` on create, and the same rule applies to a
    reassignment on `PATCH /processes/{processId}` (invariant A2).

    **`code` is never client-supplied.** It is assigned by the server on creation, using the
    `PRC-` prefix (`GrcCodeSequence`, data-model.md §2), and is rejected as an unknown property by
    the global validation pipe if a caller attempts to supply it, along with `isActive` (invariant
    A6) - situation changes only through the two dedicated transition operations below, never
    through `PATCH`.

    **There is no optimistic-locking version on this record, and this document deliberately does
    not invent one.** `processes` carries no `version` column (verified against
    `prisma/schema.prisma` - data-model.md §1 states plainly that this fase writes no migration
    touching this table's shape), unlike `Control` or `AuditEngagement`, which do and therefore
    require `If-Match` on their own mutating operations. Consequently: **no operation in this
    document declares an `If-Match` parameter, no response declares an `ETag` header, and no
    response uses `409` for a version conflict.** `PATCH /processes/{processId}` and the two
    transition operations below apply last-write-wins directly to the row. This is an accepted,
    deliberate trade-off, not an oversight: the fields these operations touch are `name`,
    `description`, `orgUnitId` and the two-state `isActive` toggle, none of which participates in a
    multi-step workflow or a derived calculation that a lost update could silently corrupt, and
    every change - including which fields changed and their previous values - is independently
    preserved on the audit trail regardless of locking (FR-015). Asserting a concurrency control
    that is not actually enforced would be worse than declaring none: a client that dutifully sent
    `If-Match` against this API would receive `400` for an unrecognized header dependency it was
    never told did not exist.

    **There is no delete operation anywhere in this document (FR-012).** A process that has left
    operation is deactivated, never removed - the two link tables that reference it
    (`RiskProcessLink`, `ControlProcessLink`) carry a `Restrict` foreign key, and erasing the row
    would in any case orphan the history of every risk and control that was ever linked to it. `POST
    /processes/{processId}/deactivate` and `POST /processes/{processId}/reactivate` are the only
    two state transitions this record has (data-model.md §3); attempting either while the process is
    already in the target state is refused with `422` and nothing changes.

    **A deactivated process stays fully readable and stays visible in the links it already has.**
    Deactivation only prevents it from being accepted as the target of a **new**
    `RiskProcessLink`/`ControlProcessLink` - a rule enforced today in the two link use cases that
    reference this record (`process-link.usecase.ts`, `control-process-link.usecase.ts`) and
    unchanged by this fase (FR-006, invariant A5).

    **The risk and control relationships shown here are read-only, by design.** `RiskProcessLink`
    and `ControlProcessLink` are owned by the Risk and Control modules respectively and are created
    and withdrawn only from those modules' own contracts (`POST`/`DELETE /risks/{riskId}/processes`,
    `POST`/`DELETE /controls/{controlId}/processes`). `GET /processes/{processId}` surfaces only the
    **currently active** links from the process's own side (FR-008) - there is deliberately no
    `POST` or `DELETE` on a `/processes/{processId}/risks` or `/processes/{processId}/controls`
    path in this document, and no third relationship path is introduced (FR-013). A link that was
    withdrawn remains visible through the owning module's own relationship listing (which supports
    `includeWithdrawn`), not duplicated here. There is deliberately no direct Process-to-Asset
    relationship in this document either - none is requested by any requirement of this fase, and
    none has a consumer today (data-model.md §"Relações declaradas"; §19.10).

    **This document supersedes `GET /processes` in `platform.openapi.yaml`.** That operation
    (`listProcesses`, tag "Reference Data") required `risk:view` and applied no organizational scope
    at all; `platform.openapi.yaml` loses this path in the same change that wires this contract, the
    same transfer `GET /controls` made out of that document in Fase 2 (research.md D-5). Its two
    current consumers - the Risk and Control process-link selectors - move to `listProcessCatalog`
    below without losing capability (FR-014); the HTTP path (`/processes`) is unchanged, only its
    owning module, its required permission and the scope it now enforces are.

    **No response in this document computes state at read time.** Every property below is a plain
    column, or a direct read of an existing link table - never a value joined or aggregated fresh
    on a particular `GET`. No operation declares `Cache-Control: no-store` (data-model.md §11).
servers:
  - url: /api/v1
    description: Single-origin API root (ADR-014).
tags:
  - name: Process Catalog
    description: Listing, searching and filtering the process catalog at scale (US1, US2, US3).
  - name: Process Record
    description: Creating and maintaining a process's descriptive and ownership data (US1).
  - name: Process Status
    description: The two-state situation (active/inactive) and its two transitions (US1, data-model.md §3).
  - name: Process Relationships
    description: >-
      READ-ONLY reverse listings of relationships another module owns (013-incidents-problems-reverse-links).
security:
  - session: []
paths:
  /processes:
    get:
      operationId: listProcessCatalog
      summary: List the process catalog
      tags: [Process Catalog]
      description: |
        Requires `process:view` - the process's own permission, never `risk:view` (US2, FR-009).
        Returns a page of processes restricted to the caller's authorized organizational scope; a
        process outside it is neither listed nor counted, and does not affect pagination (FR-010,
        spec "Vazamento 1" - the leak this operation closes). This is the one operation in this
        document where a caller who holds no `process:view` at all is refused with a flat `403`,
        because no specific record's existence is at stake in a list response.

        All filters combine with AND. `orgUnitId`, when supplied, is always intersected with the
        caller's own authorized scope - it narrows the result, it never widens it. `isActive`, when
        omitted, returns both active and inactive processes; supplied, it restricts to exactly that
        situation. Ordering is by the requested `sort` field with `code` as the tiebreaker, so
        paging is stable across requests. An empty `data` array with `meta.total` of zero and no
        filters applied means no process exists in the caller's scope; with filters applied it means
        no matches.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Case-insensitive text search across process code and name.
          schema:
            type: string
            maxLength: 200
        - name: orgUnitId
          in: query
          description: >-
            Organizational units to include. Comma-separated. Always intersected with the caller's
            authorized scope.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: isActive
          in: query
          description: Restrict to active or inactive processes. Omitted returns both.
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [code, name, updatedAt]
            default: code
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: A page of the catalog, restricted to the caller's organizational scope.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProcessSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProcess
      summary: Register a process
      tags: [Process Record]
      description: |
        Requires `process:create`. `orgUnitId` is required (invariant A1) and must lie inside the
        caller's authorized scope; a nonexistent or out-of-scope unit is refused with `422`.

        The server assigns the unique, human-readable `code` (`PRC-` prefix, `GrcCodeSequence`,
        data-model.md §2), stable for the life of the record and never client-supplied. `code` and
        `isActive` are server-owned and rejected as unknown properties if supplied (invariant A6);
        a created process is always active. Two processes may share the same `name`, including
        within the same organizational unit - `name` is never the identity (invariant A3).

        Creation is audited with the new values, including the generated `code` and `orgUnitId`
        (`process.created`, data-model.md §7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessRequest'
      responses:
        '201':
          description: Process created.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: >-
            The target organizational unit does not exist, or lies outside the caller's authorized
            scope (invariant A2). Field-level entries are returned in `errors[]`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /processes/{processId}:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    get:
      operationId: getProcess
      summary: Retrieve a process
      tags: [Process Record]
      description: |
        Requires `process:view` and the process must lie inside the caller's authorized
        organizational scope; otherwise `404` (FR-010). Includes the risks and controls the process
        is currently linked to (FR-008), read from `RiskProcessLink`/`ControlProcessLink` on the
        process's own side - withdrawn links are not included here (see this document's
        description).
      responses:
        '200':
          description: The process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProcess
      summary: Update a process's descriptive data
      tags: [Process Record]
      description: |
        Requires `process:edit` and scope. Every supplied field is validated on the server
        independently of the interface, and each changed field's previous and new value is written
        to the audit trail (`process.updated`, FR-003, data-model.md §7).

        `code` and `isActive` are read-only and are rejected as unknown properties; situation
        changes only through `POST /processes/{processId}/deactivate` and `.../reactivate`.
        Reassigning `orgUnitId` to a unit outside the caller's scope, or to one that does not exist,
        is refused with `422` (invariant A2); moving a process between units changes who can see it
        going forward and does not affect any `RiskProcessLink`/`ControlProcessLink` already
        recorded (spec Assumption A-4).

        This operation does not carry `If-Match` and there is no version conflict response: see this
        document's description for why no optimistic-locking mechanism applies to this record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessRequest'
      responses:
        '200':
          description: Updated process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /processes/{processId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      operationId: deactivateProcess
      summary: Deactivate a process
      tags: [Process Status]
      description: |
        Requires `process:administer` and scope. No request body. The process stays fully readable
        and stays visible in every `RiskProcessLink`/`ControlProcessLink` it already has - only new
        links to it are refused from this point on (FR-006, invariant A5). Refused with `422` if the
        process is already inactive, and nothing changes.

        Records who deactivated the process and when, and is audited (`process.deactivated`,
        FR-015, data-model.md §7). This operation does not carry `If-Match`: see this document's
        description for why no optimistic-locking mechanism applies to this record.
      responses:
        '200':
          description: Process deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The process is already inactive. Nothing changes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /processes/{processId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    post:
      operationId: reactivateProcess
      summary: Reactivate a process
      tags: [Process Status]
      description: |
        Requires `process:administer` and scope. No request body. The process becomes eligible
        again as the target of a new `RiskProcessLink`/`ControlProcessLink`; links already recorded
        while it was inactive were unaffected by the deactivation and remain unchanged (FR-006).
        Refused with `422` if the process is already active, and nothing changes.

        Records who reactivated the process and when, and is audited (`process.reactivated`,
        FR-015, data-model.md §7). This operation does not carry `If-Match`: see this document's
        description for why no optimistic-locking mechanism applies to this record.
      responses:
        '200':
          description: Process reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The process is already active. Nothing changes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /processes/{processId}/incidents:
    parameters:
      - $ref: '#/components/parameters/ProcessId'
    get:
      operationId: listProcessIncidentLinks
      summary: List the incidents that reference this process
      tags: [Process Relationships]
      description: |
        Requires `process:view` and scope. READ-ONLY reverse of `IncidentProcessLink`
        (013-incidents-problems-reverse-links): `modules/processes` never writes this table —
        `POST`/`DELETE /incidents/{incidentId}/processes` on the Incident side own the write path.
        Mirrors `assets.openapi.yaml`'s own `listAssetIncidentLinks` exactly, for `Process` instead
        of `Asset`.
      parameters:
        - name: includeWithdrawn
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The incidents linking to this process.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessIncidentLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pgrc_session
      description: Opaque server-side session identifier (ADR-002).
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Rows per page. Capped at 100; no endpoint returns an unbounded set.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SortDirection:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    ProcessId:
      name: processId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail - the single error shape across the API (ADR-009).
      required: [type, title, status, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Never contains a stack trace, SQL fragment or internal identifier.
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      # 2026-09-11, Finding A (007-implementation-remediation): `code` was
      # required here since this schema's introduction, but no error path in
      # the implementation has ever populated it — the shared
      # `ValidationFieldError` type (apps/api/src/shared/errors/domain-
      # error.ts) carries only `field` and `message`, and the frontend's own
      # error type never reads a `code` either. Relaxed to optional rather
      # than implemented: a machine-readable per-field validation-code
      # taxonomy is a real future capability, but it needs its own
      # specification and a real consumer that must branch on failure
      # programmatically — not retrofitted here to satisfy a line nobody
      # currently reads.
      required: [field, message]
      properties:
        field:
          type: string
        code:
          type: string
          description: >-
            Reserved for a future machine-readable per-field validation code.
            Not populated by any error path today — never assume its
            presence.
        message:
          type: string
    PageMeta:
      type: object
      description: Offset pagination envelope metadata (ADR-009).
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
    OrgUnitRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    RiskRef:
      type: object
      description: >-
        The minimal, read-only projection of a `Risk` this API ever shows (ADR-020 part 4) - id,
        code and title only.
      required: [id, code, title]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
    ControlRef:
      type: object
      description: >-
        The minimal, read-only projection of a `Control` this API ever shows (ADR-020 part 4) - id,
        code and name only.
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    ProcessSummary:
      type: object
      description: One catalog row.
      required: [id, code, name, orgUnit, isActive, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
          description: >-
            Human-readable, unique and stable for the life of the record. Server-generated; never
            client-supplied (invariant A6).
          examples: ['PRC-2026-0001']
        name:
          type: string
          readOnly: true
        descriptionExcerpt:
          type: [string, 'null']
          readOnly: true
          maxLength: 200
          description: >-
            The first 200 characters of the process's description, for list previews only. The full
            text is on `ProcessDetail.description`. `null` when the process has no description.
        orgUnit:
          # Nullable, and deliberately still REQUIRED — the property is always
          # present, its value may be null. A process created before this fase
          # (the minimal registry it was promoted from) has no organizational
          # unit recorded (research.md D-2). NULL is invisible to any
          # scope-by-unit caller (data-model.md §6) — never an invented unit.
          oneOf:
            - $ref: '#/components/schemas/OrgUnitRef'
            - type: 'null'
          readOnly: true
        isActive:
          type: boolean
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ProcessDetail:
      allOf:
        - $ref: '#/components/schemas/ProcessSummary'
        - type: object
          required: [description, createdAt, risks, controls]
          properties:
            description:
              type: [string, 'null']
              description: Stored intact regardless of length. `null` when none was recorded.
            risks:
              type: array
              description: >-
                The risks this process is currently linked to (FR-008), read from the existing
                `RiskProcessLink` on the process's own side. Only active links - a withdrawn one is
                not included here; it remains visible through `GET /risks/{riskId}/processes`.
              items:
                $ref: '#/components/schemas/RiskRef'
            controls:
              type: array
              description: >-
                The controls this process is currently linked to (FR-008), read from the existing
                `ControlProcessLink` on the process's own side. Only active links - a withdrawn one
                is not included here; it remains visible through
                `GET /controls/{controlId}/processes`.
              items:
                $ref: '#/components/schemas/ControlRef'
            createdAt:
              type: string
              format: date-time
              readOnly: true
    CreateProcessRequest:
      type: object
      description: |
        Creates an active process. `code` and `isActive` are server-owned and rejected if supplied
        (invariant A6).
      required: [name, orgUnitId]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          minLength: 1
        orgUnitId:
          type: string
          format: uuid
          description: Required (invariant A1). Must be inside the caller's authorized scope.
    UpdateProcessRequest:
      type: object
      description: |
        Partial update of descriptive data. Omitted properties are left unchanged. `code` and
        `isActive` are read-only and rejected if supplied - situation is changed only through
        `POST /processes/{processId}/deactivate` and `.../reactivate`.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          minLength: 1
        orgUnitId:
          type: string
          format: uuid
          description: >-
            Reassignment is refused with `422` if the target unit does not exist or lies outside the
            caller's authorized scope (invariant A2).
    IncidentRef:
      type: object
      description: >-
        Mirrors `problems.openapi.yaml`'s own `IncidentRef` — duplicated here because contracts
        never merge schemas across documents (packages/api-types convention).
      required: [id, code, title, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatusRef'
    IncidentStatusRef:
      type: string
      description: >-
        Mirrors `incidents.openapi.yaml`'s `IncidentStatus` - duplicated here because contracts
        never merge schemas across documents (packages/api-types convention).
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    ProcessIncidentLink:
      type: object
      description: |
        READ-ONLY reverse projection of `IncidentProcessLink` (013-incidents-problems-reverse-links):
        `modules/processes` never creates or withdraws this link — see
        `listProcessIncidentLinks`'s own description.
      required: [id, incident, linkedBy, linkedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          $ref: '#/components/schemas/IncidentRef'
        linkedBy:
          $ref: '#/components/schemas/UserRef'
        linkedAt:
          type: string
          format: date-time
          readOnly: true
        unlinkedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
  responses:
    BadRequest:
      description: >-
        The request is malformed, or carries unknown properties - including any attempt to supply
        `code` or `isActive`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No session cookie, or the session is expired or revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        The caller can see the process (in scope, holding `process:view`) but lacks the permission
        for this specific action, or the request failed the cross-site request forgery origin
        check. A caller who cannot see the process at all receives `404`, not `403`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        No such process, or the process exists but lies outside the caller's authorized
        organizational scope, or the caller lacks `process:view` entirely. The three are
        deliberately indistinguishable so the response cannot disclose the existence of a record the
        caller may not see (FR-010).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: >-
        The request is well formed but violates a domain rule - most commonly, the target
        organizational unit does not exist or lies outside the caller's authorized scope (invariant
        A2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
