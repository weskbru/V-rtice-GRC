openapi: 3.1.0
info:
  title: Vértice GRC - Shared GRC Foundation API
  version: 1.0.0
  summary: >-
    Evidence, Action and Finding - the shared GRC kernel consumed by every GRC business domain.
  description: |
    The shared GRC kernel (ADR-016). Three capabilities that no single business domain owns:
    Evidence substantiates a GRC assertion, Action tracks remediation work, Finding records a
    GRC observation.

    `Control` is deliberately absent. ADR-016 evaluated it and kept it a business domain with a
    single natural owner; it is reached through a port (ADR-020), not owned by this kernel.

    Every operation is subject to two independent server-side checks (ADR-003, ADR-004):

    1. the caller's `resource:action` permission, named in each operation's description;
    2. the caller's resolved organizational scope, applied as a mandatory predicate in the
       repository layer on every read and every write.

    **Existence is not disclosed.** A record outside the caller's organizational scope and a
    record the caller may not view are both answered with `404` - never `403` - so a response
    cannot be used to probe for records. `403` is reserved for a caller who can see the record but
    lacks the permission for that specific action, and for the CSRF origin check.

    **Both sides are checked on a link.** Linking evidence to a subject requires permission and
    scope on the evidence *and* on the subject. Neither side is inferred from the other: a link is
    never a path to a record the caller could not otherwise reach.

    **Derived values are read-only.** `overdue` on an action and `expired` on evidence are computed
    on read from `dueOn`/`validUntil` and status. No request body accepts them; they are rejected
    as unknown properties by the global validation pipe.

    **Nothing is deleted.** Evidence and findings are archived; links are unlinked with the row
    preserved. There is deliberately no `DELETE` in this document.

    **Revision made during US1 implementation, not the original design.** `CreateEvidenceRequest`
    and the `Evidence` response no longer carry `fileId`. The original design gave `Evidence` a
    real FK to `Attachment`, but `Attachment` requires its parent record to already exist before
    it can be created - so that column could never legally be populated at evidence-creation time
    (see `data-model.md` §2 for the full account). A file now reaches evidence exactly the way it
    reaches a risk: `POST /attachments` with `entityType: EVIDENCE, entityId: <evidence.id>`,
    after the evidence record already exists. Invariant E1 narrows accordingly: at least one of
    `externalUrl`/`observation` is required; evidence backed by a file still carries an
    `observation` describing what the file shows.
servers:
  - url: /api/v1
    description: Single-origin API root (ADR-014).
tags:
  - name: Evidence
    description: Records that substantiate a GRC assertion (US1).
  - name: Evidence Links
    description: Association between an evidence record and the subject it substantiates (US1).
  - name: Actions
    description: Trackable remediation work, from any GRC origin (US2).
  - name: Findings
    description: GRC observations, their remediation and their closure (US3).

paths:
  /evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: List evidence within the caller's organizational scope.
      description: |
        Requires `evidence:view`. Supports the register filters behind SC-010.

        `subjectType`/`subjectId` (both or neither - revision made during US1 implementation,
        closing a gap the original design left open): restricts the list to evidence with a
        currently-active link to that exact subject - the read path a domain screen (e.g. the risk
        detail page) uses to show its own evidence without a separate reverse-lookup endpoint
        (SC-001: "vincula um risco ... sem sair do contexto do risco"). The subject's own
        visibility is resolved first, through the same mechanism `linkEvidence` uses, so this
        filter can never disclose "evidence exists for subject X" to a caller who could not
        otherwise see subject X.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EvidenceStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/EvidenceType' }
        - name: ownerUserId
          in: query
          schema: { type: string, format: uuid }
        - name: orgUnitId
          in: query
          schema: { type: string, format: uuid }
        - name: expiringBefore
          in: query
          description: Evidence whose `validUntil` falls before this date. Drives the expiry view.
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: subjectType
          in: query
          schema: { $ref: '#/components/schemas/EvidenceSubjectType' }
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A page of evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            `subjectType`/`subjectId` was supplied and the subject does not exist, or is outside
            the caller's scope or permission - indistinguishable, per SC-005.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    post:
      tags: [Evidence]
      operationId: createEvidence
      summary: Record a new piece of evidence.
      description: |
        Requires `evidence:create` and scope over `orgUnitId`. At least one of `externalUrl` or
        `observation` must be present (invariant E1) - a proof a human cannot read is not
        evidence. A file is attached afterward, via `POST /attachments` with
        `entityType: EVIDENCE, entityId: <this evidence's id>` - never at creation time, since
        that endpoint requires the parent record to already exist. Emits `evidence.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvidenceRequest' }
      responses:
        '201':
          description: Evidence created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: >-
            A business-rule validation failure (Invariant E1, or `validUntil` before
            `collectedOn`) - or the referenced organizational unit does not exist, is inactive, or
            lies outside the caller's scope. Assurance fix: those three organizational-unit cases
            were once split across `404` ("outside scope") and `422` ("does not exist"), which let
            a scope-limited caller distinguish "exists, but not mine" from "does not exist" -
            exactly the disclosure this response exists to prevent. All three now answer here,
            with one identical message, so the response still cannot confirm existence; this
            platform never uses `404` for a validation failure at creation time in the first place
            (no existing record's existence could be disclosed by it).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/EvidenceId'
    get:
      tags: [Evidence]
      operationId: getEvidence
      summary: Read one evidence record.
      description: Requires `evidence:view`.
      responses:
        '200':
          description: The evidence record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Evidence]
      operationId: updateEvidence
      summary: Update evidence metadata.
      description: |
        Requires `evidence:edit`. `code`, `status`, `archivedAt` and the creation metadata are not
        editable. Emits `evidence.updated` carrying before and after values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEvidenceRequest' }
      responses:
        '200':
          description: Evidence updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '404': { $ref: '#/components/responses/NotFound' }

  /evidence/{evidenceId}/archive:
    parameters:
      - $ref: '#/components/parameters/EvidenceId'
    post:
      tags: [Evidence]
      operationId: archiveEvidence
      summary: Archive an evidence record.
      description: |
        Requires `evidence:administer`. Archiving never deletes and never removes links: every
        historical link stays queryable, because the fact that this evidence supported a subject at
        a point in time is itself the audit record. Emits `evidence.archived`.
      responses:
        '200':
          description: Evidence archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /evidence/{evidenceId}/links:
    parameters:
      - $ref: '#/components/parameters/EvidenceId'
    get:
      tags: [Evidence Links]
      operationId: listEvidenceLinks
      summary: List the subjects this evidence substantiates.
      description: |
        Requires `evidence:view`. Subjects outside the caller's scope are omitted, so the count
        reflects what the caller may see rather than the true total - deliberate, since the
        alternative discloses existence.
      parameters:
        - name: includeUnlinked
          in: query
          description: Include historical links that have been unlinked.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvidenceLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Evidence Links]
      operationId: linkEvidence
      summary: Link this evidence to a subject.
      description: |
        Requires `evidence:link` **and** view permission plus scope on the subject. Both sides are
        verified before the row is written. Emits `evidence.linked` carrying both identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkEvidenceRequest' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: >-
            The evidence is archived - an archived record may not gain a new link (adversarial-test
            decision; see data-model.md's own note).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404':
          description: The evidence or the subject is unknown or outside the caller's scope.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409':
          description: An active link between this evidence and this subject already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /evidence/{evidenceId}/links/{linkId}/unlink:
    parameters:
      - $ref: '#/components/parameters/EvidenceId'
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Evidence Links]
      operationId: unlinkEvidence
      summary: Unlink this evidence from a subject.
      description: |
        Requires `evidence:link`. The row is preserved with `unlinkedAt` and `unlinkedByUserId` -
        the link is ended, never erased. Emits `evidence.unlinked`.
      responses:
        '200':
          description: Unlinked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /actions:
    get:
      tags: [Actions]
      operationId: listActions
      summary: List actions within the caller's organizational scope.
      description: |
        Requires `action:view`. `responsibleUserId` plus `overdue` answers the "my overdue work"
        view; `originType` plus `originId` answers "the work arising from this record".
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ActionStatus' }
        - name: responsibleUserId
          in: query
          schema: { type: string, format: uuid }
        - name: originType
          in: query
          schema: { $ref: '#/components/schemas/ActionOriginType' }
        - name: originId
          in: query
          schema: { type: string, format: uuid }
        - name: overdue
          in: query
          description: Computed on read; there is no stored overdue column.
          schema: { type: boolean }
        - name: dueBefore
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: A page of actions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Actions]
      operationId: createAction
      summary: Create an action from a GRC origin.
      description: |
        Requires `action:create`, plus edit permission and scope on the origin record - work is
        created by whoever may act on the thing it arises from. A `dueOn` in the past is accepted:
        late remediation is recorded, not prevented. Emits `action.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActionRequest' }
      responses:
        '201':
          description: Action created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The origin record is unknown or outside the caller's scope.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /actions/{actionId}:
    parameters:
      - $ref: '#/components/parameters/ActionId'
    get:
      tags: [Actions]
      operationId: getAction
      summary: Read one action.
      description: Requires `action:view`.
      responses:
        '200':
          description: The action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Actions]
      operationId: updateAction
      summary: Update an action's title, description, responsible or due date.
      description: |
        Requires `action:edit`. `status` is not changed here - lifecycle transitions have their own
        operations so each emits its own semantic audit event rather than a generic update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActionRequest' }
      responses:
        '200':
          description: Action updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /actions/{actionId}/transitions:
    parameters:
      - $ref: '#/components/parameters/ActionId'
    post:
      tags: [Actions]
      operationId: transitionAction
      summary: Move an action through its lifecycle.
      description: |
        Requires `action:edit`. Legal transitions only; an illegal transition is `422`. Reopening a
        completed action requires a reason and emits `action.reopened`, preserving the previous
        completion. Each transition emits its own event: `action.started`, `action.completed`,
        `action.cancelled`, `action.reopened`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionActionRequest' }
      responses:
        '200':
          description: Transition applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The requested transition is not legal from the current status.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /actions/{actionId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/ActionId'
    get:
      tags: [Actions]
      operationId: listActionAuditEvents
      summary: Retrieve the audit trail for the action.
      description: |
        Requires `audit:view` **and** `action:view` and scope. Returns audit entries for the
        action itself — `action.created`, `action.updated` and every lifecycle transition
        (`action.started`, `action.completed`, `action.cancelled`, `action.reopened`) — each with
        actor, timestamp, action, entity type, entity identifier, outcome and the allow-listed
        previous and new values. Mirrors `GET /risks/{riskId}/audit-events`'s own two-tier
        authorization exactly (see that operation's description).

        A caller without `audit:view` who can otherwise see the action receives `403` - the
        action's existence is already known to them, so no information is disclosed by the
        distinction. A caller who cannot see the action at all - including one whose action is
        visible only because its origin is now out of the caller's organizational scope - receives
        `404`.

        Audit entries are append-only: there is deliberately no endpoint that modifies or deletes
        one. Secrets, credentials and session identifiers never appear in any payload.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: action
          in: query
          description: Filter to one business action, for example `action.completed`.
          schema:
            type: string
            maxLength: 100
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: occurredFrom
          in: query
          schema: { type: string, format: date-time }
        - name: occurredTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: A page of audit entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /findings:
    get:
      tags: [Findings]
      operationId: listFindings
      summary: List findings within the caller's organizational scope.
      description: |
        Requires `finding:view`.

        `orgUnitId` (revision made during US3 implementation, closing a gap the original design
        left open, the same shape `listEvidence`'s own `orgUnitId` filter and its documented
        precedent already establish): restricts the list to findings belonging to that exact
        organizational unit - the read path a domain screen (the risk detail page's own "Achados"
        panel) uses to show findings relevant to its own organizational context, since this phase
        does not model a direct Finding-to-Risk relationship (data-model.md's own diagram has none
        - Finding relates only to Evidence and Action). Still fully subject to the caller's own
        scope: an `orgUnitId` outside it simply yields an empty page, never a scope bypass.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FindingStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/FindingSeverity' }
        - name: ownerUserId
          in: query
          schema: { type: string, format: uuid }
        - name: orgUnitId
          in: query
          schema: { type: string, format: uuid }
        - name: withoutRemediation
          in: query
          description: Open findings with no linked action - the unremediated backlog.
          schema: { type: boolean }
      responses:
        '200':
          description: A page of findings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Findings]
      operationId: createFinding
      summary: Record a finding.
      description: Requires `finding:create` and scope over `orgUnitId`. Emits `finding.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFindingRequest' }
      responses:
        '201':
          description: Finding created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /findings/{findingId}:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Read one finding.
      description: Requires `finding:view`.
      responses:
        '200':
          description: The finding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Findings]
      operationId: updateFinding
      summary: Update a finding's descriptive fields, severity or priority.
      description: |
        Requires `finding:edit`. **`status` is not accepted here** and is rejected as an unknown
        property: closure, reopening and archival each have their own operation so that each emits
        its own semantic event and so that closure cannot bypass the segregation-of-duties rule
        through a generic update. Severity and priority are separate fields and change
        independently: severity describes the gravity of what was observed, priority the urgency of
        acting. A priority change emits its own event so "which severe findings were deprioritised,
        by whom" stays answerable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFindingRequest' }
      responses:
        '200':
          description: Finding updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /findings/{findingId}/reopen:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      tags: [Findings]
      operationId: reopenFinding
      summary: Reopen a closed finding.
      description: |
        Requires `finding:close` - reopening reverses a closure, so it answers to the same
        authority. Requires a reason, and emits `finding.reopened`. The previous closure is
        preserved: `closedAt`, `closedByUserId` and the justification of that closure stay in the
        audit trail, because a finding that was closed and reopened is a different fact from one
        that was never closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenFindingRequest' }
      responses:
        '200':
          description: Finding reopened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The finding is not closed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /findings/{findingId}/archive:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      tags: [Findings]
      operationId: archiveFinding
      summary: Archive a closed finding.
      description: |
        Requires `finding:administer`. Only a closed finding may be archived - archiving is
        removal from circulation, never a shortcut past closure and its segregation-of-duties
        rule. Archiving never deletes: linked evidence and actions stay queryable. Emits
        `finding.archived`.
      responses:
        '200':
          description: Finding archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The finding is not closed, so it cannot be archived.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /findings/{findingId}/close:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      tags: [Findings]
      operationId: closeFinding
      summary: Close a finding.
      description: |
        Requires `finding:close`. Two rules are enforced in the domain and covered by tests:

        - **Segregation of duties**: the closer may not be the responsible user of any completed
          action linked to this finding. The same principle already applied to risk approvals.
        - Closing requires either a completed linked action or a written justification.

        Completing every linked action does **not** close the finding: closure is always an
        explicit act. Emits `finding.closed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseFindingRequest' }
      responses:
        '200':
          description: Finding closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            The caller lacks `finding:close`, or is the responsible user of a completed action on
            this finding (segregation of duties).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Neither a completed linked action nor a justification was provided.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActionId:
      name: actionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed or invalid request body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    UnprocessableEntity:
      description: >-
        A business-rule validation failure distinct from request-shape validation (e.g. Invariant
        E1, an out-of-scope creation target, an evidence-lifecycle rule) - matches this platform's
        established `400` (shape)/`422` (business rule) split.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: >-
        The caller can see the record but lacks the permission for this action, or the CSRF origin
        check failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: >-
        Unknown, or outside the caller's organizational scope. The two are deliberately
        indistinguishable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem document (ADR-009).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    EvidenceType:
      type: string
      enum: [DOCUMENT, SCREENSHOT, SYSTEM_LOG, ATTESTATION, INSPECTION, OTHER]
    EvidenceSource:
      type: string
      enum: [MANUAL_UPLOAD, SYSTEM_EXPORT, THIRD_PARTY, INSPECTION]
    EvidenceStatus:
      type: string
      description: >-
        Stored state only. Expiry is NOT here: it is derived from `validUntil` on read and exposed
        as the `expired` boolean, so `validUntil` stays the single source of truth and no periodic
        job is needed to move records between states.
      enum: [ACTIVE, ARCHIVED]
    EvidenceSubjectType:
      type: string
      enum: [RISK, RISK_TREATMENT_DECISION, FINDING, ACTION]
    ActionOriginType:
      type: string
      description: >-
        Closed registry of origin kinds `Action.originType` may carry (schema.prisma's own
        enum is authoritative). Grown by later phases without a contract amendment here being
        made: `CONTROL_ASSESSMENT` (003-controls-management), `INCIDENT`/`PROBLEM`
        (008-incidents-problems) were each fully wired at the domain level - resolver
        registered, audit allow-list, convergence guard green - while this enum still listed
        only the original two, so `POST /actions` rejected every one of them at request
        validation. Fixed 2026-09-11 alongside `CreateActionRequestDto`'s own list, which now
        derives from the Prisma enum at runtime instead of restating it a second time.
      enum: [RISK_TREATMENT, FINDING, CONTROL_ASSESSMENT, INCIDENT, PROBLEM]
    ActionStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED]
    FindingCategory:
      type: string
      enum: [NONCONFORMITY, CONTROL_DEFICIENCY, OBSERVATION, IMPROVEMENT_OPPORTUNITY]
    FindingOrigin:
      type: string
      enum: [INTERNAL_ASSESSMENT, CONTROL_TESTING, MANAGEMENT_REVIEW]
    FindingSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    FindingPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    FindingStatus:
      type: string
      enum: [OPEN, IN_REMEDIATION, CLOSED, ARCHIVED]

    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        # Optional (not in `required`, additive to the original shape) —
        # `AuditEvent.actor` (`listActionAuditEvents`) is the only response
        # in this document that populates it, mirroring
        # `contracts/risks.openapi.yaml`'s own `UserRef`, which already
        # carries this same optional field for the identical reason
        # (`listRiskAuditEvents`). Every other `UserRef` usage in this
        # document is unaffected: an optional property absent from a
        # response body is not a contract violation.
        email: { type: string, format: email }

    OrgUnitRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Evidence:
      type: object
      required:
        [id, code, orgUnit, title, type, source, owner, collectedOn, status, expired, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['EVD-2026-0001'] }
        orgUnit: { $ref: '#/components/schemas/OrgUnitRef' }
        title: { type: string }
        description: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/EvidenceType' }
        source: { $ref: '#/components/schemas/EvidenceSource' }
        owner: { $ref: '#/components/schemas/UserRef' }
        collectedOn: { type: string, format: date }
        validUntil: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/EvidenceStatus' }
        expired:
          type: boolean
          description: Computed on read from `validUntil`; never stored.
        externalUrl: { type: [string, 'null'] }
        observation: { type: [string, 'null'] }
        linkCount:
          type: integer
          description: Active links the caller may see - not necessarily the true total.
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateEvidenceRequest:
      type: object
      required: [orgUnitId, title, type, source, ownerUserId, collectedOn]
      properties:
        orgUnitId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        type: { $ref: '#/components/schemas/EvidenceType' }
        source: { $ref: '#/components/schemas/EvidenceSource' }
        ownerUserId: { type: string, format: uuid }
        collectedOn: { type: string, format: date }
        validUntil: { type: string, format: date }
        externalUrl: { type: string, format: uri, maxLength: 2000 }
        observation: { type: string, maxLength: 4000 }

    UpdateEvidenceRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        type: { $ref: '#/components/schemas/EvidenceType' }
        source: { $ref: '#/components/schemas/EvidenceSource' }
        ownerUserId: { type: string, format: uuid }
        collectedOn: { type: string, format: date }
        validUntil: { type: [string, 'null'], format: date }
        externalUrl: { type: string, format: uri, maxLength: 2000 }
        observation: { type: string, maxLength: 4000 }

    EvidenceLink:
      type: object
      required: [id, evidenceId, subjectType, subjectId, linkedAt, linkedBy]
      properties:
        id: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/EvidenceSubjectType' }
        subjectId: { type: string, format: uuid }
        subjectLabel:
          type: string
          description: Human-readable label for the subject, resolved for display.
        note: { type: [string, 'null'] }
        linkedAt: { type: string, format: date-time }
        linkedBy: { $ref: '#/components/schemas/UserRef' }
        unlinkedAt: { type: [string, 'null'], format: date-time }
        unlinkedBy:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'

    LinkEvidenceRequest:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType: { $ref: '#/components/schemas/EvidenceSubjectType' }
        subjectId: { type: string, format: uuid }
        note: { type: string, maxLength: 1000 }

    Action:
      type: object
      required:
        [id, code, orgUnit, originType, originId, title, responsible, dueOn, status, overdue, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['ACT-2026-0001'] }
        orgUnit: { $ref: '#/components/schemas/OrgUnitRef' }
        originType: { $ref: '#/components/schemas/ActionOriginType' }
        originId: { type: string, format: uuid }
        originLabel:
          type: string
          description: Human-readable label for the origin record, resolved for display.
        title: { type: string }
        description: { type: [string, 'null'] }
        responsible: { $ref: '#/components/schemas/UserRef' }
        dueOn: { type: string, format: date }
        status: { $ref: '#/components/schemas/ActionStatus' }
        overdue:
          type: boolean
          description: Computed on read by the single overdue rule; never stored.
        completedAt: { type: [string, 'null'], format: date-time }
        reopenedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateActionRequest:
      type: object
      required: [originType, originId, title, responsibleUserId, dueOn]
      properties:
        originType: { $ref: '#/components/schemas/ActionOriginType' }
        originId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        responsibleUserId: { type: string, format: uuid }
        dueOn: { type: string, format: date }

    UpdateActionRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        responsibleUserId: { type: string, format: uuid }
        dueOn: { type: string, format: date }

    TransitionActionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/ActionStatus' }
        reason:
          type: string
          maxLength: 1000
          description: Required when reopening a completed action.

    Finding:
      type: object
      required:
        [id, code, orgUnit, title, description, category, origin, severity, priority, owner,
         identifiedOn, status, auditEngagementId, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['FND-2026-0001'] }
        orgUnit: { $ref: '#/components/schemas/OrgUnitRef' }
        title: { type: string }
        description: { type: string }
        recommendation: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/FindingCategory' }
        origin: { $ref: '#/components/schemas/FindingOrigin' }
        severity: { $ref: '#/components/schemas/FindingSeverity' }
        priority: { $ref: '#/components/schemas/FindingPriority' }
        owner: { $ref: '#/components/schemas/UserRef' }
        identifiedOn: { type: string, format: date }
        status: { $ref: '#/components/schemas/FindingStatus' }
        openActionCount: { type: integer }
        evidenceCount: { type: integer }
        closedAt: { type: [string, 'null'], format: date-time }
        closureJustification: { type: [string, 'null'] }
        auditEngagementId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            005-audit-findings, T089 — the origin of this finding: the audit engagement that
            produced it (`POST /audits/{auditId}/findings`), or `null` for one recorded manually
            (`POST /findings`, this document's own `createFinding`).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateFindingRequest:
      type: object
      required:
        [orgUnitId, title, description, category, origin, severity, priority, ownerUserId,
         identifiedOn]
      properties:
        orgUnitId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 8000 }
        recommendation: { type: string, maxLength: 4000 }
        category: { $ref: '#/components/schemas/FindingCategory' }
        origin: { $ref: '#/components/schemas/FindingOrigin' }
        severity: { $ref: '#/components/schemas/FindingSeverity' }
        priority: { $ref: '#/components/schemas/FindingPriority' }
        ownerUserId: { type: string, format: uuid }
        identifiedOn: { type: string, format: date }

    UpdateFindingRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 8000 }
        recommendation: { type: string, maxLength: 4000 }
        category: { $ref: '#/components/schemas/FindingCategory' }
        severity: { $ref: '#/components/schemas/FindingSeverity' }
        priority: { $ref: '#/components/schemas/FindingPriority' }
        ownerUserId: { type: string, format: uuid }

    ReopenFindingRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 4000 }

    CloseFindingRequest:
      type: object
      properties:
        justification:
          type: string
          maxLength: 4000
          description: Required when no completed linked action exists.

    EvidencePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    ActionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    FindingPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    # `listActionAuditEvents` only — deliberately `{data, meta}`, not this
    # document's own `items`/`page`/`pageSize`/`total` convention
    # (`ActionPage`/`EvidencePage`/`FindingPage` above): mirrors
    # `contracts/risks.openapi.yaml`'s `listRiskAuditEvents` envelope
    # exactly, its own established precedent for an audit-trail page.
    PageMeta:
      type: object
      description: Offset pagination envelope metadata.
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    AuditEvent:
      type: object
      description: >-
        An immutable audit entry. Append-only - no operation modifies or deletes one. Mirrors
        `contracts/risks.openapi.yaml`'s own `AuditEvent` schema field-for-field.
      required: [id, occurredAt, actorLabel, action, entityType, outcome, correlationId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        occurredAt: { type: string, format: date-time, readOnly: true }
        actor:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          readOnly: true
          description: Null only for pre-authentication events.
        actorLabel:
          type: string
          readOnly: true
          description: Actor name as recorded, so history reads correctly after a rename.
        action:
          type: string
          readOnly: true
          description: 'Business action, for example `action.completed` - never a table name.'
        entityType: { type: string, readOnly: true }
        entityId: { type: [string, 'null'], format: uuid, readOnly: true }
        previousValues:
          type: [object, 'null']
          readOnly: true
          description: Allow-listed fields only. Secrets, credentials and session identifiers are
            never eligible.
        newValues: { type: [object, 'null'], readOnly: true }
        outcome:
          type: string
          enum: [SUCCESS, FAILURE, DENIED]
          readOnly: true
          description: '`DENIED` records security-relevant refusals.'
        ipAddress: { type: [string, 'null'], readOnly: true }
        userAgent: { type: [string, 'null'], readOnly: true }
        correlationId: { type: string, format: uuid, readOnly: true }
